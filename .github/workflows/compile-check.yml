name: Compile check

# Fast "does it compile" check for working branches (about 5-8 minutes on a GitHub runner), so a change
# does not have to be compiled on a small machine first. No secrets needed; the release workflow
# (main.yml) stays the only one that signs and builds the app.
on:
  push:
    branches-ignore: [ "main" ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Compile Kotlin (debug)
        run: gradle :app:compileDebugKotlin --no-daemon -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Unit tests (debug)
        run: gradle :app:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
